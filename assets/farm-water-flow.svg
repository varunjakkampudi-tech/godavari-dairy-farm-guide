<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">Farm rainwater and wastewater separation</title><desc id="d">Concept flow separates clean roof runoff into a screened rainwater route and storage from dirty shed wash water routed through a solids trap and approved treatment or disposal. Arrows indicate surveyed slope and safe outfall planning.</desc><rect width="800" height="460" fill="#fbfaf5"/><text x="30" y="40" font-size="24" font-family="system-ui" font-weight="700" fill="#173d32">Clean rain and dirty water · keep routes separate</text><rect x="60" y="105" width="255" height="150" rx="14" fill="#d8e6d9" stroke="#557c5f" stroke-width="3"/><text x="110" y="155" font-size="20" font-family="system-ui">ROOF RUNOFF</text><text x="95" y="190" font-size="16" font-family="system-ui">screen → tank / safe overflow</text><path d="M315 180 H455" stroke="#3480a0" stroke-width="8"/><path d="M440 166 l20 14 -20 14" fill="none" stroke="#3480a0" stroke-width="8"/><rect x="470" y="115" width="250" height="130" rx="14" fill="#dceaf0" stroke="#668a9a" stroke-width="3"/><text x="535" y="165" font-size="20" font-family="system-ui">CLEAN STORAGE</text><text x="505" y="198" font-size="15" font-family="system-ui">protected from animal runoff</text><rect x="60" y="300" width="180" height="100" rx="12" fill="#f2d7ca" stroke="#a15a3c" stroke-width="3"/><text x="95" y="345" font-size="18" font-family="system-ui">SHED WASH</text><path d="M240 350 H330" stroke="#a15a3c" stroke-width="8"/><path d="M315 336 l20 14 -20 14" fill="none" stroke="#a15a3c" stroke-width="8"/><rect x="345" y="300" width="180" height="100" rx="12" fill="#f5e4ad" stroke="#967b35" stroke-width="3"/><text x="375" y="345" font-size="17" font-family="system-ui">SOLIDS TRAP</text><path d="M525 350 H610" stroke="#a15a3c" stroke-width="8"/><path d="M595 336 l20 14 -20 14" fill="none" stroke="#a15a3c" stroke-width="8"/><rect x="625" y="300" width="145" height="100" rx="12" fill="#e9dded" stroke="#80638a" stroke-width="3"/><text x="645" y="340" font-size="15" font-family="system-ui">APPROVED</text><text x="645" y="362" font-size="15" font-family="system-ui">TREAT / DISPOSE</text><text x="60" y="435" font-family="system-ui" font-size="14" fill="#586b61">Do not discharge to wells, waterways or neighboring plots; confirm legal outfall and flood-safe design locally.</text></svg>
