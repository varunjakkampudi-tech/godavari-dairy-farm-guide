<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Seasonal buffalo-farm readiness cycle</title><desc id="d">Three seasonal panels: summer focuses on shade, airflow, water and power backup; monsoon focuses on elevated feed, clear drains, dry floors, safe electricity and evacuation route; cooler periods focus on dry bedding, draft protection for calves, ventilation and continued water access.</desc><rect width="900" height="420" fill="#fbfaf5"/><text x="30" y="38" font-size="24" font-family="system-ui" font-weight="700" fill="#173d32">Seasonal readiness · check forecasts and the actual site</text><g font-family="system-ui"><rect x="30" y="75" width="260" height="270" rx="18" fill="#fff0d5" stroke="#b47c28" stroke-width="3"/><text x="55" y="115" font-size="22" font-weight="700" fill="#6b4718">HOT / HUMID</text><text x="55" y="158" font-size="17" fill="#3e3423">Shade + moving air</text><text x="55" y="190" font-size="17" fill="#3e3423">Clean water / trough flow</text><text x="55" y="222" font-size="17" fill="#3e3423">Cooling equipment + power</text><text x="55" y="254" font-size="17" fill="#3e3423">Cool-hour work + feed</text><text x="55" y="297" font-size="15" fill="#6b4718">Emergency: distress → vet now</text><rect x="320" y="75" width="260" height="270" rx="18" fill="#dceaf0" stroke="#668a9a" stroke-width="3"/><text x="345" y="115" font-size="22" font-weight="700" fill="#244451">HEAVY RAIN / FLOOD</text><text x="345" y="158" font-size="17" fill="#243940">Clear drains; check roof</text><text x="345" y="190" font-size="17" fill="#243940">Raise and protect feed</text><text x="345" y="222" font-size="17" fill="#243940">Dry footing; safe circuits</text><text x="345" y="254" font-size="17" fill="#243940">Plan higher-ground route</text><text x="345" y="297" font-size="15" fill="#244451">Evacuate before access fails</text><rect x="610" y="75" width="260" height="270" rx="18" fill="#e9dded" stroke="#80638a" stroke-width="3"/><text x="635" y="115" font-size="22" font-weight="700" fill="#44334a">COOLER / WET SPELL</text><text x="635" y="158" font-size="17" fill="#352d38">Dry bedding; protect calves</text><text x="635" y="190" font-size="17" fill="#352d38">Block direct drafts</text><text x="635" y="222" font-size="17" fill="#352d38">Keep ventilation and water</text><text x="635" y="254" font-size="17" fill="#352d38">Inspect feed for damp/mold</text><text x="635" y="297" font-size="15" fill="#44334a">Coastal winters are not assumed severe</text></g><text x="30" y="390" font-size="14" font-family="system-ui" fill="#586b61">Concept illustration · use official IMD alerts and veterinary/local authority advice; no guarantee of site-specific hazard or forecast.</text></svg>
