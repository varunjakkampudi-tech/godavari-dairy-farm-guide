<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">Hygienic buffalo milking workflow</title><desc id="d">A numbered flow in four groups: worker and equipment preparation; observe the animal and clean and dry teats with individual towels; inspect foremilk, milk hygienically and keep abnormal or withheld milk separate; measure, filter, protect and hand off milk, then clean equipment and record the result.</desc><rect width="1000" height="650" fill="#fbfaf5"/><text x="35" y="45" font-family="system-ui" font-size="27" font-weight="750" fill="#173d32">Clean milk workflow · follow product and buyer instructions</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#49695a"/></marker></defs><g font-family="system-ui" fill="#173d32"><g><rect x="35" y="85" width="215" height="205" rx="18" fill="#dce9d9" stroke="#557c5f" stroke-width="3"/><text x="58" y="125" font-size="22" font-weight="700">1 · PREPARE</text><text x="58" y="165" font-size="17">Worker hygiene</text><text x="58" y="194" font-size="17">Clean, food-grade tools</text><text x="58" y="223" font-size="17">Animal / appetite check</text><text x="58" y="252" font-size="16">Separate treated/abnormal milk</text></g><path d="M255 185 H285" stroke="#49695a" stroke-width="5" marker-end="url(#a)"/><g><rect x="295" y="85" width="215" height="205" rx="18" fill="#dceaf0" stroke="#668a9a" stroke-width="3"/><text x="318" y="125" font-size="22" font-weight="700">2 · CLEAN</text><text x="318" y="165" font-size="17">Inspect udder / teats</text><text x="318" y="194" font-size="17">Clean if soiled</text><text x="318" y="223" font-size="17">One clean towel per animal</text><text x="318" y="252" font-size="16">Dry teats completely</text></g><path d="M515 185 H545" stroke="#49695a" stroke-width="5" marker-end="url(#a)"/><g><rect x="555" y="85" width="215" height="205" rx="18" fill="#f5e4ad" stroke="#967b35" stroke-width="3"/><text x="578" y="125" font-size="22" font-weight="700">3 · MILK</text><text x="578" y="165" font-size="17">Check foremilk</text><text x="578" y="194" font-size="17">Use clean hands / machine</text><text x="578" y="223" font-size="17">Keep abnormal milk separate</text><text x="578" y="252" font-size="16">Post-milking teat care</text></g><path d="M775 185 H805" stroke="#49695a" stroke-width="5" marker-end="url(#a)"/><g><rect x="815" y="85" width="150" height="205" rx="18" fill="#e9dded" stroke="#80638a" stroke-width="3"/><text x="832" y="125" font-size="21" font-weight="700">4 · HANDLE</text><text x="832" y="165" font-size="16">Measure</text><text x="832" y="194" font-size="16">Filter</text><text x="832" y="223" font-size="15">Protect / handoff</text><text x="832" y="252" font-size="15">Wash + record</text></g><rect x="65" y="350" width="870" height="225" rx="18" fill="#fff0ed" stroke="#8b2f25" stroke-width="3"/><text x="95" y="395" font-size="23" font-weight="750" fill="#68251e">STOP + SEPARATE</text><text x="95" y="440" font-size="18" fill="#3b1712">Clots, flakes, blood, watery milk, udder pain/swelling, fever or sudden yield change:</text><text x="95" y="475" font-size="18" fill="#3b1712">do not mix with sale milk. Follow buyer rules and call the veterinarian for assessment.</text><text x="95" y="525" font-size="16" fill="#3b1712">After treatment, return milk only when the veterinarian/label withdrawal time and buyer acceptance are confirmed.</text><text x="35" y="620" font-size="15" fill="#586b61">Illustrative training aid · use clean water, food-safe products, equipment manuals, veterinary direction and current buyer protocol.</text></g></svg>
