<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual small dairy farm zones</title>
  <desc id="desc">A not-to-scale functional layout showing road and gate, clean entry, dry feed storage, animal shed and yard, milking and calf areas, and a separated dirty-water and manure zone. Final placement depends on the surveyed plot and drainage.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#49695a"/></marker>
    <pattern id="hatch" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#f1e6d7"/><line x1="0" y1="0" x2="0" y2="12" stroke="#bb6948" stroke-width="3"/></pattern>
  </defs>
  <rect width="1000" height="650" rx="28" fill="#fbfaf5"/>
  <text x="58" y="55" fill="#173d32" font-family="system-ui,sans-serif" font-size="27" font-weight="750">Functional zones · site-specific survey required</text>
  <rect x="56" y="90" width="888" height="500" rx="20" fill="#f4f4ec" stroke="#315445" stroke-width="5"/>
  <rect x="56" y="90" width="888" height="64" rx="20" fill="#d9d8cd"/>
  <text x="82" y="130" fill="#303d36" font-family="system-ui,sans-serif" font-size="21" font-weight="700">ACCESS ROAD · safe vehicle / milk pickup route</text>
  <path d="M112 154 V186" stroke="#49695a" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="86" y="176" width="160" height="80" rx="14" fill="#dce9d9" stroke="#557c5f" stroke-width="2"/>
  <text x="166" y="209" text-anchor="middle" fill="#173d32" font-family="system-ui,sans-serif" font-size="18" font-weight="700">GATE + CLEAN</text>
  <text x="166" y="233" text-anchor="middle" fill="#405b4c" font-family="system-ui,sans-serif" font-size="15">boot / handwash point</text>
  <rect x="274" y="176" width="228" height="116" rx="14" fill="#f5e4ad" stroke="#967b35" stroke-width="2"/>
  <text x="388" y="211" text-anchor="middle" fill="#443818" font-family="system-ui,sans-serif" font-size="18" font-weight="700">DRY + CLEAN ZONE</text>
  <text x="388" y="237" text-anchor="middle" fill="#564b2d" font-family="system-ui,sans-serif" font-size="15">feed / equipment store</text>
  <text x="388" y="261" text-anchor="middle" fill="#564b2d" font-family="system-ui,sans-serif" font-size="15">protected water supply</text>
  <rect x="530" y="176" width="360" height="220" rx="16" fill="#d8e6d9" stroke="#557c5f" stroke-width="3"/>
  <text x="710" y="212" text-anchor="middle" fill="#173d32" font-family="system-ui,sans-serif" font-size="20" font-weight="750">ANIMAL ZONE</text>
  <rect x="556" y="236" width="190" height="132" rx="12" fill="#fffdf7" stroke="#829b83" stroke-width="2"/>
  <text x="651" y="276" text-anchor="middle" fill="#173d32" font-family="system-ui,sans-serif" font-size="17" font-weight="700">SHADED SHED</text>
  <text x="651" y="302" text-anchor="middle" fill="#405b4c" font-family="system-ui,sans-serif" font-size="14">airflow · safe footing</text>
  <text x="651" y="325" text-anchor="middle" fill="#405b4c" font-family="system-ui,sans-serif" font-size="14">feed + clean water</text>
  <rect x="764" y="236" width="100" height="132" rx="12" fill="#c4d9c5" stroke="#829b83" stroke-width="2"/>
  <text x="814" y="286" text-anchor="middle" fill="#173d32" font-family="system-ui,sans-serif" font-size="15" font-weight="700">YARD</text>
  <text x="814" y="310" text-anchor="middle" fill="#405b4c" font-family="system-ui,sans-serif" font-size="13">shade +</text>
  <text x="814" y="331" text-anchor="middle" fill="#405b4c" font-family="system-ui,sans-serif" font-size="13">drainage</text>
  <rect x="86" y="286" width="190" height="116" rx="14" fill="#dceaf0" stroke="#668a9a" stroke-width="2"/>
  <text x="181" y="327" text-anchor="middle" fill="#244451" font-family="system-ui,sans-serif" font-size="18" font-weight="700">MILK HANDOFF</text>
  <text x="181" y="354" text-anchor="middle" fill="#355764" font-family="system-ui,sans-serif" font-size="15">clean, protected route</text>
  <text x="181" y="378" text-anchor="middle" fill="#355764" font-family="system-ui,sans-serif" font-size="14">buyer timing / cooling</text>
  <rect x="303" y="322" width="199" height="112" rx="14" fill="#e9dded" stroke="#80638a" stroke-width="2"/>
  <text x="402" y="361" text-anchor="middle" fill="#44334a" font-family="system-ui,sans-serif" font-size="17" font-weight="700">CALF / ISOLATION</text>
  <text x="402" y="387" text-anchor="middle" fill="#56445c" font-family="system-ui,sans-serif" font-size="14">separate, observable</text>
  <text x="402" y="410" text-anchor="middle" fill="#56445c" font-family="system-ui,sans-serif" font-size="14">veterinarian-guided</text>
  <rect x="530" y="420" width="360" height="122" rx="14" fill="url(#hatch)" stroke="#a15a3c" stroke-width="2"/>
  <text x="710" y="461" text-anchor="middle" fill="#57321f" font-family="system-ui,sans-serif" font-size="18" font-weight="700">DIRTY / DOWN-GRADIENT ZONE</text>
  <text x="710" y="490" text-anchor="middle" fill="#57321f" font-family="system-ui,sans-serif" font-size="15">manure handling · wastewater route · compost</text>
  <text x="710" y="516" text-anchor="middle" fill="#57321f" font-family="system-ui,sans-serif" font-size="14">keep runoff away from wells, feed and milk areas</text>
  <path d="M246 216 H265" stroke="#49695a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M502 231 H519" stroke="#49695a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M181 266 V277" stroke="#49695a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M710 398 V411" stroke="#49695a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="78" y="565" fill="#586b61" font-family="system-ui,sans-serif" font-size="14">Concept only · Not to scale · Confirm plot shape, flood levels, soil, setbacks, drainage outfall, lease rights and local approvals before design/build.</text>
</svg>
