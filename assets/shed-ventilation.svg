<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">Shed ventilation and roof heat concept</title><desc id="d">Cross-section of a raised, reflective roof with ridge outlet and open sides. Arrows show hot air escaping upward and fresh air entering from both sides. Shade and roof insulation are shown as optional design measures.</desc><rect width="800" height="460" fill="#fbfaf5"/><text x="30" y="40" font-size="24" font-family="system-ui" font-weight="700" fill="#173d32">Airflow + roof heat · concept section</text><path d="M130 300 L400 115 L670 300" fill="#e7dfc7" stroke="#315445" stroke-width="10"/><path d="M370 135 L400 115 L430 135 V165 H370Z" fill="#fff" stroke="#315445" stroke-width="3"/><rect x="150" y="300" width="500" height="12" fill="#9d8461"/><path d="M150 300 V410 M650 300 V410" stroke="#315445" stroke-width="9"/><path d="M95 330 H245 M705 330 H555" stroke="#3480a0" stroke-width="7"/><path d="M235 318 l20 12 -20 12 M565 318 l-20 12 20 12" fill="none" stroke="#3480a0" stroke-width="6"/><path d="M320 280 C310 220 355 185 375 150 M480 280 C490 220 445 185 425 150" fill="none" stroke="#b45c35" stroke-width="7"/><path d="M363 165 l15 -18 8 24 M437 165 l-15 -18 -8 24" fill="none" stroke="#b45c35" stroke-width="6"/><text x="72" y="355" font-family="system-ui" font-size="17" fill="#244451">Fresh air in</text><text x="514" y="355" font-family="system-ui" font-size="17" fill="#244451">Fresh air in</text><text x="315" y="95" font-family="system-ui" font-size="17" fill="#8b482c">Hot air out at ridge</text><text x="268" y="435" font-family="system-ui" font-size="15" fill="#586b61">Maintain shade and airflow; engineer checks wind, rain, structure and local materials.</text></svg>
